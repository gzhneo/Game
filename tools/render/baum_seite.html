<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bäume frei Vergleich</title>
<style>
:root{--bg:#f3f1ed;--panel:#fbfaf8;--fg:#25221e;--muted:#6c665d;--line:#d9d4cb;--accent:#4f6b2a;--ink:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#171512;--panel:#201d19;--fg:#ece7de;--muted:#a29a8d;--line:#3a352e;--accent:#9bbf62;--ink:#171512;color-scheme:dark}}
:root[data-theme=dark]{--bg:#171512;--panel:#201d19;--fg:#ece7de;--muted:#a29a8d;--line:#3a352e;--accent:#9bbf62;--ink:#171512;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,Segoe UI,sans-serif;margin:0;padding:24px 16px}
.w{max-width:1280px;margin:auto;display:grid;gap:14px}h1{margin:0;font-size:1.6rem}p{margin:0;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button,select{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:6px 10px;cursor:pointer}
button[aria-pressed=true]{background:var(--accent);color:var(--ink);border-color:var(--accent)}
.stage{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:4px;background:#000;aspect-ratio:/*SEITENVERHAELTNIS*/;touch-action:none;user-select:none;max-width:100%}
.stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;max-width:none}
.tag{position:absolute;top:8px;font:12px monospace;background:rgba(0,0,0,.7);color:#fff;padding:3px 7px;border-radius:3px;pointer-events:none}
.h{position:absolute;top:0;bottom:0;width:2px;background:#fff;box-shadow:0 0 0 1px #0007;pointer-events:none}
input[type=range]{width:100%;accent-color:var(--accent)}
</style></head><body>
<div class="w"><h1>/*TITEL*/</h1>
<p>/*TEXT*/</p>
<div class="row" id="karten"></div>
<div class="row" id="halte"></div>
<div class="row"><label>Links <select id="l"></select></label><label>Rechts <select id="r"></select></label><span style="color:var(--muted)">Schieber ziehen, Pfeiltasten wechseln den Halt</span></div>
<div class="stage" id="st"><img id="ir" alt=""><img id="il" alt=""><span class="tag" style="left:8px" id="tl"></span><span class="tag" style="right:8px" id="tr"></span><div class="h" id="h"></div></div>
<input type="range" id="reg" min="0" max="100" value="50" aria-label="Schieber">
<p>/*FUSS*/</p></div>
<script>
const D=/*DATEN*/null;const F=/*FASSUNGEN*/null;const S=/*SZENEN*/null;
const $=i=>document.getElementById(i);let sz=0,ha=0;
for(const s of ["l","r"]){for(const [k,n] of F){const o=document.createElement("option");o.value=k;o.textContent=n;$(s).append(o);}}
$("l").value=F[0][0];$("r").value=F[Math.min(1,F.length-1)][0];
S.forEach((s,i)=>{const b=document.createElement("button");b.textContent=s[1];b.onclick=()=>{sz=i;ha=0;halte();z();};$("karten").append(b);});
function halte(){$("halte").innerHTML="";S[sz][2].forEach((f,i)=>{const b=document.createElement("button");b.textContent="Halt "+(i+1);b.onclick=()=>{ha=i;z();};$("halte").append(b);});}
function z(){const s=S[sz],f=s[2][ha],a=$("l").value,b=$("r").value;$("il").src=D[s[0]+"_"+f+"_"+a];$("ir").src=D[s[0]+"_"+f+"_"+b];
$("tl").textContent=F.find(x=>x[0]==a)[1];$("tr").textContent=F.find(x=>x[0]==b)[1];
[...$("karten").children].forEach((b,i)=>b.setAttribute("aria-pressed",String(i==sz)));[...$("halte").children].forEach((b,i)=>b.setAttribute("aria-pressed",String(i==ha)));}
function s(){const p=$("reg").value;$("il").style.clipPath="inset(0 "+(100-p)+"% 0 0)";$("h").style.left=p+"%";}
$("l").onchange=z;$("r").onchange=z;$("reg").oninput=s;
document.addEventListener("keydown",e=>{const n=S[sz][2].length;if(e.key=="ArrowRight"){ha=(ha+1)%n;z();}if(e.key=="ArrowLeft"){ha=(ha+n-1)%n;z();}});
const st=$("st");function mv(e){const r=st.getBoundingClientRect();$("reg").value=Math.max(0,Math.min(100,(e.clientX-r.left)/r.width*100));s();}
st.addEventListener("pointerdown",e=>{st.setPointerCapture(e.pointerId);mv(e);st.onpointermove=mv;});st.addEventListener("pointerup",()=>st.onpointermove=null);
halte();z();s();
</script></body></html>
