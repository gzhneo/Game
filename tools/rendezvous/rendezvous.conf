# Einstellungen fuer gzh-rendezvous. Eine Zeile "Schluessel = Wert",
# '#' leitet einen Kommentar ein. Alle Werte haben Vorgaben; diese Datei nennt sie.

port = 8090                 # UDP-Port
bind = ::                   # :: = alle Adressen, IPv6 und IPv4; oder eine feste Adresse
max_rooms = 4096            # gleichzeitige Raeume
rooms_per_address = 4       # Raeume je Absenderadresse (IPv6: je /64)
room_ttl_seconds = 60       # ein Raum ohne Auffrischung verfaellt

relay = yes                 # Pakete weiterleiten, wenn Spieler einander nicht direkt erreichen
max_relays = 512            # gleichzeitige Relais-Sitzungen (eine je Spiel)
relay_kib_per_session = 128 # KiB je Sekunde und Sitzung (ein Spiel zu acht braucht weit weniger)
relay_mib_total = 16        # MiB je Sekunde fuer alle Sitzungen zusammen
relay_ttl_seconds = 120     # eine Sitzung ohne Verkehr verfaellt

knocks_per_second = 4       # Beitrittsversuche je Raum und Sekunde, die der Host gemeldet bekommt
packets_per_second = 60     # Steuernachrichten je Absender (Relais-Verkehr zaehlt nicht)
packet_burst = 120

log_addresses = no          # Adressen der Spieler protokollieren (Datenschutz: nur zur Fehlersuche)
stats_seconds = 300         # Statistikzeile alle n Sekunden, 0 = nie

# Andere Server, die dieser Server den Spielern nennt (dezentrales Netz); beliebig viele Zeilen.
# peer = meet.example.org
# peer = 203.0.113.9:8090
