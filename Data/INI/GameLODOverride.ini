End

; The menu calls this level "Ultra".
StaticGameLOD = VeryHigh
  MinimumFPS = 30
  MinimumProcessorFps = 0
  SampleCount2D = 6
  SampleCount3D = 24
  StreamCount = 2
  MaxParticleCount = 10000
  UseShadowVolumes = Yes
  UseShadowDecals = Yes
  UseCloudMap = Yes
  UseLightMap = Yes
  ShowSoftWaterEdge = Yes
  WaterQuality = 2
  D3D11Effects = fxaa,sharpen,softparticles,colorgrade,ssao,shadowmap=4096,terraindetail,terrainrock,terrainnormal=2,terraintess=2,rocktess=1,particlelight,particleground,bloom,heat,haze,lights,hdr
  TerrainAnisotropy = 16
  MaxTankTrackEdges = 400
  MaxTankTrackOpaqueEdges = 100
  MaxTankTrackFadeDelay = 120000
  UseBuildupScaffolds = Yes
  UseTreeSway = Yes
  UseEmissiveNightMaterials = Yes
  UseHeatEffects = Yes
