; Detail levels of GZH Neo (one file for Generals and Zero Hour)
;
; This file overrides the StaticGameLOD blocks of GameLOD.ini from the game data. It is loaded last
; (GameLOD.cpp); loose files take precedence over the .big archives.
;
; EA's values were made for computers of 2003: "Low" turned off the cloud map, light map, tree sway,
; build-up scaffolds, night materials and the soft water edge, and halved all textures. On the minimum
; hardware (Intel Core i7-4770 with HD Graphics 4600) all of that costs practically nothing: extra
; texture stages and a second pass on buildings. Halved textures would make the game visibly worse.
; So every level gets the full picture; graded is only what really costs today: the particle count
; (CPU time), length and lifetime of tank tracks, stencil shadow volumes (fill rate) versus flat decals,
; and the effects below.
;
; The particle limit only draws on the client random stream (33 calls of GameClientRandomValue in
; ParticleSys.cpp, none from the logic stream), so players with different detail levels cannot desync
; a network game.
;
; MinimumFPS/MinimumProcessorFps are kept for completeness; the hardware rating that used them is gone.
; SampleCount2D/3D and StreamCount are sound channels, equal in all levels as with EA. UseHeatEffects is
; used by Zero Hour data only; in Generals it has no effect (and is on by default in GameLOD.cpp).
;
; WaterQuality: 0 = still water as with EA, 1 = turbidity (Beer-Lambert) and Fresnel reflection,
; 2 = additionally refraction. With Direct3D 11 levels 1 and 2 also bring the new water: waves, sky,
; sun glint, foam at the shore, flowing rivers. The command line switch -waterQuality overrides the level.
;
; D3D11Effects: rendering effects of Direct3D 11 (and Vulkan), a comma-separated list. In Settings.ini,
; [Detail] D3D11Effects = -colorgrade takes one effect out, a list without "-" replaces the level's list;
; the [Effects] section and the options menu switch single effects; -d3d11Effects overrides all of it.
; - fxaa, sharpen, softparticles, colorgrade: edge smoothing, sharpening, soft particles, colour grading.
; - ssao: ambient occlusion (from High).
; - shadowmap=<size>: sun shadows by shadow map (Medium 1024, High 2048, Very high 4096); Low keeps the
;   stencil and projected shadows.
; - terraindetail (=0..2 strength): detail layer from CC0 photo scans on the terrain (from Medium).
; - terrainrock: rock structure on steep slopes and per-pixel light (from High).
; - particlelight (=0..1 strength): smoke and dust take the light of the time of day and the dynamic
;   lights; particleground: particles do not sink into the terrain (from Medium).
; - terrainnormal (=0..2 strength): normals and gloss of the free terrain textures (<name>_n.dds in
;   Data/FreierBoden), per-pixel map light. Very high only (second atlas in video memory); without
;   relief files (EA textures) the picture stays the same.
; - terraintess (=0..2 strength): displacement of nearby terrain from height maps (<name>_h.dds in
;   Data/FreierBoden); Very high only, without height files the picture stays the same.
; - rocktess (=0..2 strength): steep slopes from about 37 degrees get depth up close; works with
;   terraintess and terrainrock, also on EA terrain (flat height atlas, about 11 MB).
; - bloom, heat, haze, lights: bloom, heat shimmer, distance haze, dynamic lights (High and Very high).
; - hdr: values above 1 in the 3D scene (explosions, fire, sun glint on water), tone curve with knee 0.8
;   to 8 bit, bloom only from values above white. High and Very high; no effect with multisampling.
; - Not in any level (off unless set in Settings.ini or the options menu): alphacoverage, softshadows,
;   contactshadows, shadowcascades, msaadepth (on anyway with multisampling; -msaadepth or
;   [Effects] MsaaDepth = off turns the depth effects off with multisampling), deband (noise against
;   banding in gradients), waterssr (reflections in water with a flat camera), gtao (horizon-based
;   ambient occlusion at full resolution instead of SSAO), taa (temporal anti-aliasing, replaces fxaa).
;
; TerrainAnisotropy: anisotropic filtering of the terrain atlas (0 = trilinear as with EA; the other
; textures already used 16x). Low 1, from Medium 16x. -terrainAnisotropy overrides it.
;
; RenderScale: internal resolution of the 3D scene as a share of the window resolution (0.5 to 1, also
; 50 to 100); the scene is scaled up, interface and text stay sharp. Without an entry 1. Low uses 0.75
; (filter bicubic). Settings.ini [Display] RenderScale overrides the level, -renderScale both. The
; texture tier (Auto) follows the height drawn this way (TextureTiers.cpp uses the same value for Low).

; Low without post-processing and particle effects: on an HD 630 the set fxaa, sharpen, softparticles,
; colorgrade, particlelight, particleground cost about a quarter of the frame time (FXAA alone about 9 %).
StaticGameLOD = Low
  MinimumFPS = 10
  MinimumProcessorFps = 0
  SampleCount2D = 6
  SampleCount3D = 24
  StreamCount = 2
  MaxParticleCount = 2000
  UseShadowVolumes = No
  UseShadowDecals = No
  UseCloudMap = Yes
  UseLightMap = Yes
  ShowSoftWaterEdge = Yes
  WaterQuality = 0
  D3D11Effects = none
  TerrainAnisotropy = 1
  RenderScale = 0.75
  MaxTankTrackEdges = 100
  MaxTankTrackOpaqueEdges = 25
  MaxTankTrackFadeDelay = 30000
  UseBuildupScaffolds = Yes
  UseTreeSway = Yes
  UseEmissiveNightMaterials = Yes
  UseHeatEffects = Yes
  TextureReductionFactor = 0
End

StaticGameLOD = Medium
  MinimumFPS = 15
  MinimumProcessorFps = 0
  SampleCount2D = 6
  SampleCount3D = 24
  StreamCount = 2
  MaxParticleCount = 4000
  UseShadowVolumes = No
  UseShadowDecals = Yes
  UseCloudMap = Yes
  UseLightMap = Yes
  ShowSoftWaterEdge = Yes
  WaterQuality = 1
  D3D11Effects = fxaa,sharpen,softparticles,colorgrade,shadowmap=1024,terraindetail,particlelight,particleground
  TerrainAnisotropy = 16
  MaxTankTrackEdges = 100
  MaxTankTrackOpaqueEdges = 25
  MaxTankTrackFadeDelay = 60000
  UseBuildupScaffolds = Yes
  UseTreeSway = Yes
  UseEmissiveNightMaterials = Yes
  UseHeatEffects = Yes
  TextureReductionFactor = 0
End

