  TerrainAnisotropy = 16
  MaxTankTrackEdges = 200
  MaxTankTrackOpaqueEdges = 50
  MaxTankTrackFadeDelay = 60000
  UseBuildupScaffolds = Yes
  UseTreeSway = Yes
  UseEmissiveNightMaterials = Yes
