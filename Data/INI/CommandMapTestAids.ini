; Key bindings of the test aids (Generals and Zero Hour)
;
; This file belongs to GZH Neo. The game loads it only with the command line switch -testhilfen or
; Settings.ini [General] TestAids = yes (GameEngine.cpp), as the last key map: keys that EA's
; CommandMapDebug.ini (debug build only) also uses then go to the test aids. They act only in
; single player (skirmish, campaign), never in multiplayer.
;
; The shortcuts from EA's developer map keep their keys (US layout; KEY_EQUAL is the key right of
; the sharp s on a German keyboard). New shortcuts sit on keys that are in the same place on a
; German keyboard (letters except Y/Z, function keys). Avoid Ctrl + Alt: that is AltGr.
;
; Each command has exactly one entry (MetaMap::getMetaMapRec); a second entry of the same name
; replaces the first.

; Side panel open/close
CommandMap TESTHILFE_MENUE
  Key = KEY_M
  Transition = DOWN
  Modifiers = ALT
  UseableIn = GAME
End

; Display of the active test aids on/off
CommandMap TESTHILFE_ANZEIGE
  Key = KEY_A
  Transition = DOWN
  Modifiers = ALT
  UseableIn = GAME
End

; Fast forward x1 -> x2 -> x4 -> x8 -> x1
CommandMap TESTHILFE_ZEITRAFFER
